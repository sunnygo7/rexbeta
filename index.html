<html lang="en"><head></head><body>
  <meta charset="UTF-8">
  <title>Game Search</title>
  <style>
    /* Styling for the search input field */
    #searchBar {
      padding: 10px;
      font-size: 16px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 20px;
    }

    /* Container for the game layouts */
    #buttonContainer {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    /* Keep the images uniform in size */
    .searchable-btn img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }
  </style>



  <!-- 1. THE SEARCH INPUT -->
  <input type="text" id="searchBar" placeholder="Search games..." onkeyup="filterButtons()">

  <!-- 2. THE BUTTON CONTAINER -->
  <div id="buttonContainer">
    
    <a href="1.html" class="searchable-btn">
      <img src="1/1.png" alt="Game One">
    </a>
    
    <a href="2.html" class="searchable-btn">
      <img src="2/2.png" alt="Game Two">
    </a>

    <a href="3.html" class="searchable-btn">
      <img src="3/3.png" alt="Action Adventure">
    </a>

  </div>

  <!-- 3. THE JAVASCRIPT LOGIC -->
  <script>
    function filterButtons() {
      // Get the value typed into the search bar
      const input = document.getElementById('searchBar').value.toLowerCase();
      
      // Get the container and all individual link items
      const container = document.getElementById('buttonContainer');
      const items = container.getElementsByClassName('searchable-btn');

      // Loop through every link inside the container
      for (let i = 0; i < items.length; i++) {
        const img = items[i].querySelector('img');
        
        // Read the text written inside the alt="" attribute
        const gameTitle = img ? img.getAttribute('alt').toLowerCase() : "";
        
        // Hide or show the item based on the text match
        if (gameTitle.includes(input)) {
          items[i].style.display = ""; // Reset to default display style
        } else {
          items[i].style.display = "none"; // Hide completely
        }
      }
    }
  </script>


</body></html>
