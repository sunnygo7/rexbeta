<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Game Search</title>
  <style>
    /* Styling for the search input field */
    #searchBar {
      padding: 10px;
      font-size: 16px;
      width: 100%;
      max-width: 300px;
      margin-bottom: 20px;
    }

    /* Container for the game layouts */
    #buttonContainer {
      display: flex;
      gap: 15px;
      flex-wrap: wrap;
    }

    /* Keep the images uniform in size */
    .searchable-btn img {
      width: 150px;
      height: 150px;
      object-fit: cover;
      border-radius: 8px;
    }
  </style>
</head>
<body>

  <!-- 1. THE SEARCH INPUT -->
  <input type="text" id="searchBar" placeholder="Search games..." onkeyup="filterButtons()">

  <!-- 2. THE BUTTON CONTAINER -->
  <div id="buttonContainer">
    
    <a href="1.html" class="searchable-btn">
      <img src="1/1.png" alt="MC12">
    </a>
    
    <a href="2.html" class="searchable-btn">
      <img src="1/2.png" alt="PKEM">
    </a>
    
    <a href="3b/pvz-portable.html" class="searchable-btn">
      <img src="1/3.png" alt="PVZP">
    </a>

    <a href="4.html" class="searchable-btn">
      <img src="1/4.jpg" alt="PKFR">
    </a>

  </div>

  <!-- 3. THE JAVASCRIPT LOGIC -->
  <script>
    // Handles downloading the file first, then redirects after a 200ms delay
    function downloadAndRedirect(event, fileUrl, targetPage) {
      // Prevent the browser from leaving the page instantly
      event.preventDefault();

      // Trigger the hidden download process
      const tempLink = document.createElement('a');
      tempLink.href = fileUrl;
      tempLink.download = fileUrl.split('/').pop();
      document.body.appendChild(tempLink);
      tempLink.click();
      document.body.removeChild(tempLink);

      // Wait a fraction of a second for the download request to fire, then redirect
      setTimeout(function() {
        window.location.href = targetPage;
      }, 200); 
    }

    // Your existing search logic
    function filterButtons() {
      const input = document.getElementById('searchBar').value.toLowerCase();
      const container = document.getElementById('buttonContainer');
      const items = container.getElementsByClassName('searchable-btn');

      for (let i = 0; i < items.length; i++) {
        const img = items[i].querySelector('img');
        const gameTitle = img ? img.getAttribute('alt').toLowerCase() : "";
        
        if (gameTitle.includes(input)) {
          items[i].style.display = ""; 
        } else {
          items[i].style.display = "none"; 
        }
      }
    }
  </script>

</body>
</html>
